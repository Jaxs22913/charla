.x:active{transform:scale(.9)}
.x .i{width:24px;height:24px}
.bar{flex:1;height:16px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.bar-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--jade),var(--sol));transition:width .65s var(--e-spring);position:relative;overflow:hidden}
.bar-fill::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.42)}
.bar-fill::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:translateX(-100%)}
.bar-fill.glint::before{animation:glint .8s ease-out .15s}
@keyframes glint{to{transform:translateX(100%)}}
.combo{display:flex;align-items:center;gap:3px;font-weight:800;color:var(--sol);min-width:46px;justify-content:flex-end;font-variant-numeric:tabular-nums}
.combo .i{width:22px;height:22px;animation:flick 1.2s ease-in-out infinite;transform-origin:50% 85%}
.combo.pop{animation:cpop .5s var(--e-spring)}
@keyframes cpop{40%{scale:1.5;rotate:-10deg}}
.combo-pop{position:absolute;left:50%;top:calc(66px + env(safe-area-inset-top,0px));z-index:6;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:9px 18px;border-radius:999px;background:linear-gradient(135deg,var(--hot-a),var(--hot-b));color:var(--on-color);font-weight:800;font-size:16px;white-space:nowrap;box-shadow:0 14px 30px -12px var(--chile-d);pointer-events:none;animation:comboPop 1.6s var(--e-out) both}
.combo-pop .i{width:22px;height:22px}
@keyframes comboPop{0%{scale:.3;opacity:0;translate:0 12px}14%{scale:1.12;opacity:1;translate:0 0}24%{scale:1}80%{opacity:1}100%{opacity:0;translate:0 -24px}}
.rv-count{font-weight:800;color:var(--ink-2);min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.ov-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:8px 16px 24px;max-width:620px;width:100%;margin:0 auto}
.ov.fbopen .ov-body{padding-bottom:330px}
.ov-foot{border-top:2px solid var(--line);background:var(--bg)}
.foot-in{max-width:620px;margin:0 auto;padding:12px 16px 14px;min-height:80px}
.foot-in>.btn{animation:stIn .4s var(--e-out) both}
/* curtain */
.curtain{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;color:var(--on);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 78%,#fff) 0%,var(--c) 45%,color-mix(in srgb,var(--c) 80%,#000) 100%);cursor:pointer;overflow:hidden}
.curtain::before{content:"";position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(color-mix(in srgb,var(--on) 10%,transparent) 0 7deg,transparent 7deg 16deg);animation:spin 50s linear infinite;pointer-events:none}
.cu-k{position:relative;font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.9;animation:stIn .5s var(--e-out) .25s both}
.cu-t{position:relative;font-family:var(--f-display);font-size:clamp(46px,14vw,82px);line-height:1.05;text-wrap:balance;max-width:12ch;text-shadow:0 5px 0 color-mix(in srgb,var(--c-d) 75%,transparent);animation:cuPop .9s var(--e-spring) .32s both}
@keyframes cuPop{from{opacity:0;scale:.4;rotate:-8deg}}
.cu-s{position:relative;font-weight:700;font-size:16px;animation:stIn .5s var(--e-out) .5s both}
.cu-bar{position:relative;width:120px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--on) 25%,transparent);margin-top:16px;overflow:hidden}
.cu-bar i{display:block;height:100%;background:var(--on);border-radius:3px;transform-origin:left;animation:growX 1.35s linear .1s both}
.cu-skip{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));font-size:13px;font-weight:700;opacity:.75;animation:fadeIn .5s .9s both}
.curtain.out{animation:curtainOut .65s var(--e-inout) forwards;pointer-events:none}
@keyframes curtainOut{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 100% 0)}}
/* exercises */
.ex{animation:exIn .5s var(--e-out) both}
.ex.out{animation:exOut .17s ease-in both}
@keyframes exIn{from{opacity:0;translate:40px 0}}
@keyframes exOut{to{opacity:0;translate:-40px 0}}
.ex-k{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--rosa)}
.ex-k .muted{letter-spacing:.06em}
.ex-q{font-size:18px;font-weight:700;color:var(--ink-2);margin:4px 0 16px}
.ex-q.big{font-size:25px;font-weight:800;color:var(--ink);line-height:1.25;text-wrap:balance}
.say{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.big-es{font-family:var(--f-display);font-size:34px;line-height:1.2;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.big-es.long{font-size:25px}
.listen{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:6px 0 24px}
.listen .spk{width:100px;height:100px;border-radius:32px;box-shadow:0 6px 0 var(--azul-d),0 18px 30px -12px var(--azul-d)}
.listen .spk .i{width:46px;height:46px}
.listen .spk.slow{width:64px;height:64px;border-radius:20px;box-shadow:0 4px 0 var(--line)}
.listen .spk.slow .i{width:30px;height:30px}
.listen .spk:not(.slow)::after{content:"";position:absolute;inset:-8px;border-radius:38px;border:3px solid var(--azul);opacity:0;animation:pulse 2.2s ease-out .8s infinite;pointer-events:none}
.listen .spk{position:relative}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:var(--surface);font-weight:700;font-size:17px;min-height:58px;line-height:1.25;transition:border-color .15s,background .15s,transform .1s,box-shadow .2s,color .15s}
.opt:active:not(:disabled){transform:translateY(2px)}
@media (hover:hover){.opt:hover:not(:disabled){border-color:color-mix(in srgb,var(--azul) 40%,var(--line))}}
.opt .n{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--ink-2);flex:none;transition:border-color .15s,color .15s,background .15s}
.opt[aria-pressed="true"]{border-color:var(--azul);background:color-mix(in srgb,var(--azul) 11%,var(--surface));color:var(--azul);box-shadow:0 0 0 4px color-mix(in srgb,var(--azul) 14%,transparent)}
.opt[aria-pressed="true"] .n{border-color:var(--azul);color:var(--azul)}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good-t);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 18%,transparent);animation:okPop .5s var(--e-spring)}
.opt.right .n{border-color:var(--good);background:var(--good);color:var(--on-color)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-t);animation:shake .42s}
@keyframes okPop{40%{scale:1.04}}
.ans{min-height:118px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:6px 0 12px;background:repeating-linear-gradient(to bottom,transparent 0 54px,var(--line) 54px 56px)}
.ans.right{animation:okPop .5s var(--e-spring)}
.ans.wrong{animation:shake .42s}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.tile{padding:10px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);font-weight:700;font-size:17px;line-height:1.2;transition:transform .1s;will-change:transform}
.tile:active:not(:disabled){transform:translateY(2px)}
.tile.tin{animation:popScale .45s var(--e-spring) both;animation-delay:calc(var(--i) * 40ms + .25s)}
.tile.ghost{background:var(--surface-2);border-color:transparent;color:transparent;animation:none}
.ans .tile{border-color:color-mix(in srgb,var(--azul) 35%,var(--line))}
.ans.right .tile{border-color:var(--good);color:var(--good-t)}
.ans.wrong .tile{border-color:var(--bad);color:var(--bad-t)}
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.mt{padding:12px 10px;min-height:60px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);font-weight:700;font-size:15px;line-height:1.2;transition:opacity .35s,border-color .15s,background .15s,color .15s,scale .3s}
.mt.sel{border-color:var(--azul);color:var(--azul);background:color-mix(in srgb,var(--azul) 11%,var(--surface));scale:1.03}
.mt.ok{border-color:var(--good);color:var(--good-t);background:var(--good-bg);opacity:.45;scale:.96;pointer-events:none}
.mt.no{border-color:var(--bad);color:var(--bad-t);background:var(--bad-bg);animation:shake .42s}
.type-in{width:100%;font-size:21px;font-weight:600;padding:15px 16px;border:2px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);transition:border-color .2s,box-shadow .2s}
.type-in:focus{border-color:var(--azul);outline:none;box-shadow:0 0 0 5px color-mix(in srgb,var(--azul) 16%,transparent)}
.accents{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.accents button{min-width:42px;height:42px;padding:0 6px;border-radius:11px;border:2px solid var(--line);border-bottom-width:3px;background:var(--surface);font-weight:700;font-size:17px;transition:transform .1s}
.accents button:active{transform:translateY(2px)}
.cant{display:block;margin:20px auto 0;font-weight:800;font-size:14px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;padding:8px}
.tip-card{margin-top:12px;background:var(--surface);border-radius:24px;padding:20px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tip-ic{width:50px;height:50px;border-radius:16px;background-color:var(--c);background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 60%);color:var(--on);display:grid;place-items:center;margin-bottom:12px;animation:popScale .6s var(--e-spring) .25s both}
.tip-ic .i{width:26px;height:26px}
.tip-t{font-family:var(--f-display);font-weight:400;font-size:27px;line-height:1.15;color:var(--c);text-wrap:balance}
.tip-b{margin-top:10px;font-size:17px;line-height:1.6;max-width:62ch}
.tip-b b{color:var(--ink);font-weight:800}
/* lotería card */
.lot{position:relative;background:var(--surface);border:3px solid var(--ink);border-radius:20px;padding:10px;box-shadow:7px 7px 0 var(--c);height:100%}
.lot-in{border:2px solid var(--ink);border-radius:13px;min-height:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:repeating-conic-gradient(from 0deg at 50% 46%,color-mix(in srgb,var(--c) 10%,transparent) 0 7deg,transparent 7deg 14deg)}
.lot-top{display:flex;justify-content:space-between;align-items:center;padding:10px 10px 0 14px;min-height:50px}
.lot-no{font-weight:800;font-size:14px;letter-spacing:.06em}
.lot-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px 16px 20px;gap:10px}
.lot-word{font-family:var(--f-display);line-height:1.15;color:var(--c);overflow-wrap:anywhere;text-wrap:balance}
.lot-word.plain{font-family:var(--f-body);font-weight:800;color:var(--ink)}
.lot-sub{font-size:19px;font-weight:700;color:var(--ink);text-wrap:balance}
.lot-note{font-size:14px;font-weight:600;color:var(--ink-2);max-width:32ch}
.lot-name{border-top:2px solid var(--ink);padding:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:13px;text-align:center;background:var(--c);color:var(--on)}
.intro-wrap{perspective:1100px;max-width:360px;margin:14px auto 0}
.intro-card{min-height:340px;display:flex;animation:cardIn .9s var(--e-spring) .12s both}
@keyframes cardIn{from{rotate:y -85deg;scale:.85;opacity:0}}
.intro-card .lot{width:100%;overflow:hidden}
.intro-card .lot::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.4) 46%,transparent 60%);background-size:260% 100%;background-position:130% 0;animation:sheen 1.4s ease-out .7s both;pointer-events:none}
@keyframes sheen{to{background-position:-70% 0}}
/* review card */
.rv-ex{animation:fadeIn .3s both}
.rv-k{text-align:center;color:var(--ink-2);margin-top:4px}
.flip{position:relative;perspective:1400px;width:min(100%,330px);width:min(100%,330px,calc((100dvh - 300px) * .75));min-width:min(100%,240px);aspect-ratio:3/4;margin:12px auto 0;cursor:grab;touch-action:pan-y;-webkit-user-select:none;user-select:none;outline-offset:6px}
.flip:active{cursor:grabbing}
.flip.deal{animation:dealIn .7s var(--e-spring) both}
@keyframes dealIn{from{translate:0 60px;scale:.84;rotate:-6deg;opacity:0}}
.flip-tilt{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .35s var(--e-out)}
.flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s var(--e-spring)}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:3px;border-radius:17px;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.4),transparent 55%);opacity:var(--go,0);transition:opacity .3s}
.stamp{position:absolute;z-index:5;padding:3px 12px;border:4px solid currentColor;border-radius:12px;font-family:var(--f-display);font-size:25px;line-height:1.25;background:color-mix(in srgb,var(--surface) 82%,transparent);pointer-events:none;white-space:nowrap;transition:opacity .12s}
.s-good{left:16px;top:28px;color:var(--good-t);rotate:-14deg;opacity:var(--s-good,0)}
.s-again{right:16px;top:28px;color:var(--bad-t);rotate:14deg;opacity:var(--s-again,0)}
.s-easy{left:50%;top:22px;translate:-50% 0;color:var(--azul);opacity:var(--s-easy,0)}
.s-hard{left:50%;bottom:30px;translate:-50% 0;color:var(--sol-d);opacity:var(--s-hard,0)}
.rv-hint{text-align:center;font-weight:700;color:var(--ink-2);font-size:14px;margin-top:16px;min-height:1.4em}
.rv-hint.hint-in{animation:stIn .45s var(--e-out) both}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rate button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:58px;padding:8px 4px;border-radius:15px;font-weight:800;font-size:15px;background-color:var(--c);background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%);color:var(--on);box-shadow:0 4px 0 var(--c-d);transition:transform .1s,box-shadow .1s;line-height:1.15;animation:stIn .45s var(--e-spring) both;animation-delay:calc(var(--i) * 55ms)}
.rate button:active{transform:translateY(4px);box-shadow:0 0 0 var(--c-d)}
.rate small{font-weight:700;font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
/* feedback sheet */
.fb{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 0 env(safe-area-inset-bottom,0px);border-radius:26px 26px 0 0;box-shadow:0 -16px 34px -22px rgba(21,28,70,.5);animation:sheetUp .55s var(--e-spring) both}
.fb.out{animation:sheetDown .22s ease-in both}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.fb-in{max-width:620px;margin:0 auto;padding:18px 16px 14px;display:grid;gap:10px;max-height:min(72vh,72dvh);overflow-y:auto;overscroll-behavior:contain}
.fb-h{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:26px;line-height:1.1}
.fb.good .fb-h{color:var(--good-t)}
.fb.bad .fb-h{color:var(--bad-t)}
.fb-h .ic{width:38px;height:38px;border-radius:50%;background:currentColor;display:grid;place-items:center;animation:popScale .5s var(--e-spring) both}
.fb-h .ic .i{color:var(--on-color);width:22px;height:22px}
.fb-h .ic .i path{stroke-dasharray:32;stroke-dashoffset:32;animation:draw .45s var(--e-out) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fb-l{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--bad-t)}
.fb-a{font-size:20px;font-weight:800;color:var(--ink);line-height:1.25}
.fb-p{font-weight:600}
.fb-m{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink);line-height:1.3}
.fb-m span{min-width:0}
.why{justify-self:start;background:var(--surface)}
.why .i{color:var(--rosa)}
.why-out{font-weight:600;line-height:1.5;color:var(--ink);white-space:pre-wrap}
.why-out:empty{display:none}
/* done screen */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:8px;gap:6px}
.medal{position:relative;display:grid;place-items:center;width:100%;height:160px;margin-bottom:4px}
.rays{position:absolute;left:50%;top:50%;width:400px;height:400px;margin:-200px 0 0 -200px;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--sol) 28%,transparent) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(closest-side,#000 15%,transparent 100%);mask:radial-gradient(closest-side,#000 15%,transparent 100%);animation:spin 30s linear infinite,raysIn 1.1s var(--e-out) both;pointer-events:none}
@keyframes raysIn{from{scale:.2;opacity:0}}
.done-stars{position:relative;display:flex;gap:6px;align-items:flex-end}
.done-stars .i{width:62px;height:62px;color:var(--lock);animation:starIn .7s var(--e-spring) both;animation-delay:.2s;filter:drop-shadow(0 4px 0 color-mix(in srgb,var(--sol-d) 50%,transparent))}
.done-stars .i:not(.on){filter:none}
.done-stars .i.on{color:var(--sol)}
.done-stars .i:nth-child(2){width:84px;height:84px;animation-delay:.35s;margin-bottom:10px}
.done-stars .i:nth-child(3){animation-delay:.5s}
@keyframes starIn{from{scale:0;rotate:-60deg}}
.perfect{padding:6px 14px;border-radius:999px;background:linear-gradient(90deg,var(--hot-a),var(--hot-c),var(--hot-a));background-size:200% 100%;color:var(--on-color);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;animation:popScale .5s var(--e-spring) .85s both,shim 2.6s linear infinite}
.done-t{font-family:var(--f-display);font-weight:400;font-size:38px;line-height:1.1;color:var(--rosa);margin-top:4px}
.done-t .wd{display:inline-block;white-space:nowrap}
.done-t .lt{display:inline-block;animation:letterIn .75s var(--e-spring) both;animation-delay:calc(.5s + var(--i) * 34ms)}
@keyframes letterIn{from{opacity:0;transform:translateY(30px) scale(.4) rotate(-12deg)}}
.done-s{font-weight:700;color:var(--ink-2)}
.done-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:420px;margin-top:20px}
.ds{border:2px solid var(--c);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:0 10px 24px -14px var(--c-d)}
.ds span{display:block;background:var(--c);color:var(--on);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 4px}
.ds b{display:block;font-size:26px;font-weight:800;padding:10px 4px;font-variant-numeric:tabular-nums}
.goal-hit{margin-top:18px;padding:12px 16px;border-radius:16px;background:color-mix(in srgb,var(--sol) 20%,var(--surface));font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px}
.goal-hit .i{color:var(--sol);animation:flick 1.4s ease-in-out infinite;transform-origin:50% 85%}
/* chat */
.chat-top{border-bottom:2px solid var(--line);max-width:none;background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.chat-top-in{max-width:620px;width:100%;margin:0 auto;display:flex;align-items:center;gap:10px}
.ct-t{flex:1;min-width:0}
.ct-name{font-family:var(--f-display);font-size:20px;line-height:1.1}
.ct-sub{font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fbBtn:not([hidden]){animation:popScale .5s var(--e-spring) both}
.chat{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.chat-intro{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--c) 12%,var(--surface));font-size:14px;font-weight:600;animation:stIn .5s var(--e-out) .3s both}
.chat-intro .ic{width:40px;height:40px;border-radius:13px;background:var(--c);color:var(--on);display:grid;place-items:center}
.chat-intro b{display:block;color:var(--ink);font-weight:800}
.chat-intro span{color:var(--ink-2)}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg.ai{animation:aiIn .5s var(--e-spring) both;transform-origin:0 100%}
@keyframes aiIn{from{scale:.7;opacity:0;translate:-10px 10px}}
.msg-av{width:36px;height:36px;flex:none}
.msg-av .rays{transform-box:view-box;transform-origin:50% 50%}
.msg.live .msg-av .rays{animation:spin 2.6s linear infinite}
.msg.live .msg-av{animation:bob 1.2s ease-in-out infinite}
.msg-b{padding:11px 14px;border-radius:20px;min-width:0;max-width:calc(100% - 44px)}
.msg.ai .msg-b{background:var(--surface);border:2px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--shadow-sm)}
.msg.me{justify-content:flex-end;animation:meIn .45s var(--e-spring) both;transform-origin:100% 100%}
@keyframes meIn{from{scale:.6;opacity:0;translate:16px 18px}}
.msg.me .msg-b{background-color:var(--azul);background-image:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 70%);color:var(--on-color);border-bottom-right-radius:6px;font-weight:600;font-size:16px;max-width:86%;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 10px 20px -12px var(--azul-d)}
.msg .es{font-size:17px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.msg .es .w{animation:wIn .55s var(--e-out) both}
@keyframes wIn{from{opacity:0;filter:blur(5px)}}
.msg .en{margin-top:6px;font-size:14px;font-weight:600;color:var(--ink-2);filter:blur(5px);transition:filter .3s;cursor:pointer;-webkit-user-select:none;user-select:none}
.msg .en.show{filter:none;-webkit-user-select:text;user-select:text}
.msg-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.msg-err{margin-top:8px;font-size:14px;font-weight:700;color:var(--bad-t);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dots{display:inline-flex;gap:4px;padding:6px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--ink-2);animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{transform:translateY(-5px);opacity:.4}}
.fix{align-self:flex-end;max-width:86%;display:flex;gap:8px;align-items:baseline;font-size:14px;font-weight:600;padding:8px 12px;border-radius:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--sol) 30%,var(--surface)),color-mix(in srgb,var(--sol) 14%,var(--surface)));margin-top:-6px;animation:fixIn .6s var(--e-spring) both;transform-origin:100% 0}
@keyframes fixIn{from{scale:.6;opacity:0;translate:0 -8px}}
.fix .k{color:var(--sol-d);font-size:11px;flex:none}
.chat-foot .foot-in{padding-top:8px;display:grid;gap:8px;min-height:0}
.ideas{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ideas::-webkit-scrollbar{display:none}
.idea{flex:none;max-width:80%;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;text-align:left;line-height:1.25;animation:stIn .45s var(--e-out) both;animation-delay:calc(var(--i) * 80ms);transition:transform .1s,border-color .2s}
.idea:active{transform:scale(.96)}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:2px solid var(--line);border-radius:18px;background:var(--surface);padding:11px 14px;font-weight:600;font-size:16px;line-height:1.35;max-height:120px;transition:border-color .2s,box-shadow .2s}
.composer textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 4px color-mix(in srgb,var(--azul) 16%,transparent)}
.acc-t{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:18px;flex:none}
.acc-t[aria-pressed="true"]{border-color:var(--azul);color:var(--azul)}
#chatAcc:not([hidden]){animation:stIn .3s var(--e-out) both}
.send{width:48px;height:48px;border-radius:15px;background-color:var(--rosa);background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%);color:var(--on-color);display:grid;place-items:center;box-shadow:0 4px 0 var(--rosa-d);flex:none;transition:transform .1s,box-shadow .1s,background-color .2s}
.send:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--rosa-d)}
.send:disabled{background-color:var(--lock);background-image:none;box-shadow:0 4px 0 var(--lock-d);color:var(--ink-2)}
.send .i{width:22px;height:22px;animation:popScale .35s var(--e-spring)}
/* sheet + toast + confetti */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s both}
.scrim.out,.scrim.fading{animation:fadeOut .26s both}
.sheet{width:100%;max-width:620px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:0 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 40px -20px rgba(0,0,0,.35);animation:sheetUp .55s var(--e-spring) both}
.scrim.out .sheet{animation:sheetDown .26s var(--e-inout) both}
.grab-zone{padding:10px 0 14px;touch-action:none;cursor:grab}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet-t{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.15;margin-top:4px;text-wrap:balance}
.sheet-h{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:22px 0 8px;color:var(--ink-2)}
.wl{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:4px}
.wl li{animation:stIn .4s var(--e-out) both;animation-delay:calc(var(--i,0) * 22ms + .15s)}
.wl button{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;align-items:center;text-align:left;padding:9px 10px;border-radius:12px;background:var(--surface-2);transition:transform .1s}
.wl button:active{transform:scale(.98)}
.wl .i{grid-row:span 2;color:var(--azul)}
.wl b{font-weight:800;line-height:1.25}
.wl span{font-size:13px;font-weight:600;color:var(--ink-2)}
.fbk-score{display:flex;gap:4px;margin-top:10px}
.fbk-score .i{width:28px;height:28px;color:var(--lock);animation:starIn .6s var(--e-spring) both;animation-delay:calc(var(--i) * 90ms)}
.fbk-score .i.on{color:var(--sol)}
.fbk-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fbk-list li{padding:10px 12px;border-radius:12px;background:var(--surface-2);font-weight:600;line-height:1.4;animation:stIn .45s var(--e-out) both;animation-delay:calc(var(--i,0) * 70ms + .2s)}
.fbk-list .said{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--bad)}
.fbk-list .better{color:var(--good-t);font-weight:800}
.fbk-ph{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);transform:translateX(-50%);animation:toastIn .45s var(--e-spring) both;text-align:center}
.toast.out{animation:fadeOut .25s both}
@keyframes toastIn{from{translate:0 24px;scale:.9;opacity:0}}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95}
/* speak out loud */
.speak-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.scen.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px;padding:16px}
.scen.wide .ic{width:58px;height:58px;border-radius:19px;margin:0;flex:none}
.scen.wide .ic .i{width:28px;height:28px}
.scen.wide h4{font-size:22px}
.pr-sets{display:grid;gap:10px;margin-top:16px}
.pr-set{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:18px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);transition:transform .1s;animation:stIn .45s var(--e-out) both}
.pr-set:nth-child(2){animation-delay:.05s}.pr-set:nth-child(3){animation-delay:.1s}.pr-set:nth-child(4){animation-delay:.15s}
.pr-set:active:not(:disabled){transform:translateY(2px)}
.pr-set:disabled{opacity:.5}
.pr-set .ic{width:44px;height:44px;border-radius:14px;background-color:var(--c);background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 60%);color:var(--on);display:grid;place-items:center}
.pr-set b{display:block;font-weight:800;font-size:17px}
.pr-set small{display:block;color:var(--ink-2);font-weight:600;font-size:13px;line-height:1.3}
.pr-set .n{font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;padding-right:4px}
.pr-card{margin-top:12px;background:var(--surface);border:3px solid var(--ink);border-radius:22px;box-shadow:7px 7px 0 var(--c);padding:22px 18px 16px;text-align:center;position:relative;overflow:hidden;isolation:isolate}
.pr-card::before{content:"";position:absolute;left:50%;top:-120px;width:300px;height:300px;margin-left:-150px;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--c) 10%,transparent) 0 7deg,transparent 7deg 15deg);z-index:-1}
.pr-es{font-family:var(--f-display);font-size:clamp(26px,8vw,38px);line-height:1.15;color:var(--ink);text-wrap:balance;overflow-wrap:anywhere}
.pr-en{margin-top:6px;font-weight:700;color:var(--ink-2)}
.pr-syl{margin-top:14px;padding-top:12px;border-top:2px dashed var(--line);font-size:18px;font-weight:700;color:var(--ink-2);line-height:1.6;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 14px}
.pr-syl i{font-style:normal;opacity:.4;margin:0 2px}
.pr-syl .stress{color:var(--c);font-weight:800;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.pr-listen{display:flex;align-items:center;gap:12px;margin-top:16px}
.pr-chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0;flex:1}
.snd-chip{display:inline-flex;align-items:baseline;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--ink-2);transition:transform .1s}
.snd-chip:active{transform:scale(.95)}
.snd-chip b{color:var(--rosa);font-weight:800}
.pr-say{margin-top:20px;display:grid;gap:8px}
.pr-say .k{color:var(--rosa)}
.pr-say textarea{width:100%;resize:none;font-size:20px;font-weight:600;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);line-height:1.35;transition:border-color .2s,box-shadow .2s}
.pr-say textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 5px color-mix(in srgb,var(--azul) 16%,transparent)}
.pr-help{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--azul);justify-self:start;padding:4px 0}
.pr-help .i{width:16px;height:16px}
.mic-big{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border-radius:20px;background-color:var(--rosa);background-image:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 60%);color:var(--on-color);font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--rosa-d),0 14px 26px -12px var(--rosa-d);transition:transform .1s,box-shadow .1s}
.mic-big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--rosa-d)}
.mic-big .i{width:26px;height:26px}
.mic-big.on{animation:micOn 1.2s ease-in-out infinite}
.mic-big.on::after{content:"";position:absolute;inset:-7px;border-radius:26px;border:3px solid var(--rosa);animation:pulse 1.4s ease-out infinite;pointer-events:none}
@keyframes micOn{50%{scale:1.03}}
.pr-res{margin-top:18px;background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.pr-top{display:flex;align-items:center;gap:14px}
.pr-msg{font-weight:800;font-size:17px;line-height:1.3}
.pr-words{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pw{padding:5px 10px;border-radius:10px;font-weight:800;font-size:17px;animation:popScale .45s var(--e-spring) both;animation-delay:calc(var(--i) * 50ms + .1s)}
.pw.ok{background:var(--good-bg);color:var(--good-t)}
.pw.miss{background:var(--bad-bg);color:var(--bad-t)}
.pr-heard{margin-top:10px;font-size:14px;font-weight:600;color:var(--ink-2)}
.pr-miss{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.pr-miss li{padding:10px 12px;border-radius:12px;background:var(--surface-2);font-weight:600;line-height:1.45}
.pr-mine{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.foot-row{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.sg-item{padding:14px 0;border-top:1px solid var(--line);scroll-margin-top:16px;border-radius:12px;animation:stIn .4s var(--e-out) both;animation-delay:calc(var(--i) * 30ms + .1s)}
.sg-item.flash{animation:flash 1.6s ease}
@keyframes flash{0%,45%{background:color-mix(in srgb,var(--sol) 24%,transparent);box-shadow:0 0 0 8px color-mix(in srgb,var(--sol) 24%,transparent)}}
.sg-item h3{display:flex;align-items:baseline;gap:10px;font-size:17px;font-weight:800}
.sg-item h3 b{font-family:var(--f-display);color:var(--rosa);font-weight:400;font-size:22px}
.sg-item p{margin-top:4px;font-weight:600;color:var(--ink-2);line-height:1.5}
.sg-ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mic-hint{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink-2);animation:stIn .35s var(--e-out) both}
.mic-hint .i{width:18px;height:18px;color:var(--rosa);flex:none;animation:micOn 1.6s ease-in-out infinite}
.linkish{color:var(--azul);font-weight:800;font-size:13px;margin-left:auto;flex:none}
.fix.snd{background:linear-gradient(90deg,color-mix(in srgb,var(--azul) 22%,var(--surface)),color-mix(in srgb,var(--azul) 10%,var(--surface)))}
.fix.snd .k{color:var(--azul)}
.voice-t[aria-pressed="true"]{background:var(--azul);color:var(--on-color)}
.mic-t.on{border-color:var(--rosa);color:var(--rosa);animation:micOn 1.2s ease-in-out infinite}
.mic-t .i{width:22px;height:22px;margin:auto}
@media (min-width:700px){.scen-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* ================= polish layer: materials, light, depth ================= */
@property --spa{syntax:'<number>';inherits:false;initial-value:0}
@property --p{syntax:'<number>';inherits:true;initial-value:0}
:root{
  --surface-hi:#FFFFFF; --surface-lo:#F7F8FE; --edge:#D2D8EC; --rim-a:#FFFFFF; --rim-b:rgba(21,28,70,.11);
  --rim-hot:color-mix(in srgb,var(--rosa) 65%,#fff); --spot-c:var(--rosa); --spot-k:7%; --dot:rgba(21,28,70,.07);
  --lift:0 1px 1px rgba(21,28,70,.04),0 6px 14px -8px rgba(21,28,70,.16),0 26px 44px -26px rgba(21,28,70,.32);
  --lift-sm:0 1px 2px rgba(21,28,70,.06),0 10px 20px -14px rgba(21,28,70,.26);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface-hi:#1D2358; --surface-lo:#141942; --edge:#0A0D2B; --rim-a:rgba(255,255,255,.14); --rim-b:rgba(255,255,255,.025);
  --rim-hot:rgba(255,255,255,.6); --spot-c:#fff; --spot-k:8%; --dot:rgba(255,255,255,.06);
  --lift:inset 0 1px 0 rgba(255,255,255,.04),0 2px 6px rgba(0,0,0,.28),0 24px 44px -22px rgba(0,0,0,.8);
  --lift-sm:0 2px 4px rgba(0,0,0,.22),0 12px 24px -16px rgba(0,0,0,.75);
}}
:root[data-theme="dark"]{
  --surface-hi:#1D2358; --surface-lo:#141942; --edge:#0A0D2B; --rim-a:rgba(255,255,255,.14); --rim-b:rgba(255,255,255,.025);
  --rim-hot:rgba(255,255,255,.6); --spot-c:#fff; --spot-k:8%; --dot:rgba(255,255,255,.06);
  --lift:inset 0 1px 0 rgba(255,255,255,.04),0 2px 6px rgba(0,0,0,.28),0 24px 44px -22px rgba(0,0,0,.8);
  --lift-sm:0 2px 4px rgba(0,0,0,.22),0 12px 24px -16px rgba(0,0,0,.75);
}

/* ambient: a fourth color field, a fine dot grid and scroll parallax */
.blob{will-change:transform,translate}
.b4{--bc:var(--jade);right:-46vmax;bottom:-56vmax;animation-duration:48s;animation-delay:-24s}
.blob{translate:0 calc(var(--sy,0) * -.1px)}
.b2,.b4{translate:0 calc(var(--sy,0) * -.18px)}
.bg-fx::before{content:"";position:absolute;inset:-40px 0;background-image:radial-gradient(circle at center,var(--dot) 1.1px,transparent 1.7px);background-size:22px 22px;-webkit-mask-image:radial-gradient(130% 75% at 50% 0%,#000 25%,transparent 78%);mask-image:radial-gradient(130% 75% at 50% 0%,#000 25%,transparent 78%);translate:0 calc(var(--sy,0) * -.04px)}

/* card material: soft gradient body, a rim of light, and a glow that follows your finger or cursor */
.today-card,.rv-hero,.deck,.panel,.stat,.me-hero,.tip-card,.pr-res,.scen,.opt,.pr-set,.vrow,.cl,.mt{
  --spa:0;border:1px solid transparent;
  background:
    radial-gradient(320px circle at var(--mx,50%) var(--my,-40%),color-mix(in srgb,var(--spot-c) calc(var(--spa) * var(--spot-k)),transparent),transparent 70%) padding-box,
    var(--tint,linear-gradient(transparent,transparent)) padding-box,
    linear-gradient(180deg,var(--surface-hi),var(--surface-lo)) padding-box,
    radial-gradient(170px circle at var(--mx,50%) var(--my,-40%),color-mix(in srgb,var(--rim-hot) calc(var(--spa) * 100%),transparent),transparent 80%) border-box,
    linear-gradient(180deg,var(--rim-a),var(--rim-b)) border-box;
}
.lit{--spa:1}
.today-card,.rv-hero,.deck,.panel,.stat,.me-hero,.tip-card,.pr-res{box-shadow:var(--lift);transition:--spa .45s var(--e-out),rotate .6s var(--e-out)}
.scen,.opt,.pr-set,.mt,.cl,.vrow{box-shadow:0 4px 0 var(--edge),var(--lift-sm)}
.scen{--tint:radial-gradient(130% 85% at 100% 0%,color-mix(in srgb,var(--c) 18%,transparent),transparent 62%);border-width:1px;transition:transform .12s,box-shadow .12s,rotate .6s var(--e-out),--spa .45s}
.scen:active:not(:disabled),.opt:active:not(:disabled),.pr-set:active:not(:disabled),.mt:active,.cl:active,.vrow:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge),var(--lift-sm)}
@media (hover:hover){.scen:hover:not(:disabled){border-color:transparent}.scen:not(:disabled):hover,.pr-set:not(:disabled):hover,.vrow:hover{box-shadow:0 4px 0 var(--edge),var(--lift)}}
.opt{transition:border-color .15s,background .15s,transform .1s,box-shadow .2s,color .15s,--spa .45s}
.pr-set{transition:transform .12s,box-shadow .12s,rotate .6s var(--e-out),--spa .45s}
.vrow{transition:transform .12s,box-shadow .2s,--spa .45s}
.mt{transition:opacity .35s,border-color .15s,background .15s,color .15s,scale .3s,transform .1s,box-shadow .15s,--spa .45s}
.stat{position:relative;overflow:hidden;isolation:isolate}
.stat::before{content:"";position:absolute;right:-38px;top:-38px;width:120px;height:120px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 30%,transparent),transparent);z-index:-1;transition:scale .6s var(--e-spring)}
.stat.lit::before{scale:1.35}
.stat b{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 62%,#fff),var(--c) 70%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 color-mix(in srgb,var(--c-d) 45%,transparent))}

/* 3D tilt: cards lean toward your finger or cursor */
.scen-grid,.speak-grid,.stat-grid,.pr-sets,.unit,.rv-hero{perspective:900px}
.scen,.stat,.pr-set,.unit-head,.stack{rotate:var(--tilt,0 1 0 0deg)}
.unit-head,.stack{transition:rotate .6s var(--e-out)}
.tilting{transition:rotate .14s ease-out,transform .12s,box-shadow .12s,--spa .45s,opacity .3s,scale .3s!important}

/* press ripples */
.opt,.pr-set,.vrow,.mt,.rate button,.chip,.tab,.idea,.mini,.snd-chip,.seg button,.cl-play,.guide-btn,.send{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.2;scale:0;animation:rip .65s cubic-bezier(.2,.7,.3,1) forwards}
.btn .rip{background:#fff;opacity:.3}
@keyframes rip{to{scale:1;opacity:0}}

/* header */
.brand{cursor:pointer;transform-origin:0 60%;transition:scale .5s var(--e-spring)}
.brand .bl{background:linear-gradient(100deg,var(--rosa) 0%,color-mix(in srgb,var(--rosa) 50%,var(--chile)) 50%,var(--sol) 100%);background-size:600% 100%;background-position:calc(var(--i) * 20%) 0;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 color-mix(in srgb,var(--rosa-d) 65%,transparent))}
.brand .bl.hop{animation:hop .75s var(--e-spring) both;animation-delay:calc(var(--i) * 50ms)}
@keyframes hop{0%{translate:0 0}30%{translate:0 -13px;rotate:-10deg;scale:1.12}62%{translate:0 2px;rotate:3deg;scale:.96}100%{translate:0 0;rotate:0deg;scale:1}}
.topbar{transition:padding .35s var(--e-out)}
.topbar-wrap.stuck .topbar{padding-block:5px}
.topbar-wrap.stuck .brand{scale:.82}
.chip{border:1px solid transparent;background:linear-gradient(var(--surface-hi),var(--surface-lo)) padding-box,linear-gradient(180deg,var(--rim-a),var(--rim-b)) border-box;box-shadow:var(--lift-sm)}
.ring-f{filter:drop-shadow(0 0 4px color-mix(in srgb,var(--jade) 55%,transparent))}
.flag{pointer-events:auto;cursor:pointer;transform-origin:50% 0;rotate:calc(var(--wind,0) * var(--wf,1) * 1deg)}
.flag:nth-child(3n){--wf:.7}.flag:nth-child(3n+1){--wf:1.25}.flag:nth-child(4n){--wf:-.5}
.hello-t{cursor:pointer;transform-origin:0 50%}
.hello-t em{background:linear-gradient(100deg,var(--rosa),color-mix(in srgb,var(--rosa) 40%,var(--sol)));-webkit-background-clip:text;background-clip:text;color:transparent}
.hello-t.wig{animation:wig .7s var(--e-spring)}
@keyframes wig{25%{rotate:-2.5deg;scale:1.04}55%{rotate:1.5deg;scale:.99}}

/* tab bar */
.tabs-in{border:1px solid transparent;background:linear-gradient(var(--glass),var(--glass)) padding-box,linear-gradient(180deg,var(--rim-a),var(--rim-b)) border-box;box-shadow:0 1px 0 var(--hi) inset,0 24px 50px -18px rgba(8,10,40,.6)}
.tab-ind{background:linear-gradient(145deg,color-mix(in srgb,var(--rosa) 80%,#fff) 0%,var(--rosa) 48%,color-mix(in srgb,var(--rosa) 65%,var(--chile)) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.08),0 10px 24px -10px var(--rosa)}
.tab[aria-current="page"]{color:var(--on-color)}
.tab[aria-current="page"] .i{filter:drop-shadow(0 1px 0 rgba(0,0,0,.12))}
@media (hover:hover){.tab:not([aria-current]):hover{color:var(--ink)}}

/* buttons: glossy and lit from above */
.btn{background-image:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.05) 52%,rgba(0,0,0,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 0 var(--c-d,var(--rosa-d)),0 16px 28px -14px color-mix(in srgb,var(--c,var(--rosa)) 75%,transparent);transition:transform .1s,box-shadow .1s,filter .2s,translate .3s var(--e-spring)}
.btn:active:not(:disabled){box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 var(--c-d,var(--rosa-d)),0 5px 12px -8px var(--c-d,var(--rosa-d))}
@media (hover:hover){.btn:hover:not(:disabled){translate:0 -1px}}
.btn.ghost{border:1px solid transparent;background:linear-gradient(var(--surface-hi),var(--surface-lo)) padding-box,linear-gradient(180deg,var(--rim-a),var(--rim-b)) border-box;box-shadow:0 4px 0 var(--edge),var(--lift-sm)}
.btn.ghost:active:not(:disabled){box-shadow:0 0 0 var(--edge)}
.rate button{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 0 var(--c-d),0 14px 24px -14px var(--c)}
.spk{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 0 var(--azul-d),0 12px 22px -10px var(--azul)}
.spk.slow{border:1px solid transparent;background:linear-gradient(var(--surface-hi),var(--surface-lo)) padding-box,linear-gradient(180deg,var(--rim-a),var(--rim-b)) border-box;box-shadow:0 4px 0 var(--edge)}
.seg::before{box-shadow:inset 0 1px 0 var(--rim-a),0 0 0 1px var(--rim-b),var(--lift-sm);background:linear-gradient(var(--surface-hi),var(--surface-lo))}
.seg{box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}

/* aprender: the lesson trail */
.today-card .ring-f{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--jade) 55%,transparent))}
.unit-head::after{content:"";position:absolute;inset:10px 0 0;z-index:-1;pointer-events:none;background-image:radial-gradient(circle at center,rgba(255,255,255,.24) 1px,transparent 1.6px);background-size:14px 14px;-webkit-mask-image:linear-gradient(115deg,transparent 38%,#000 92%);mask-image:linear-gradient(115deg,transparent 38%,#000 92%)}
.unit-head{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 5px 0 var(--c-d),0 22px 34px -18px var(--c-d)}
.unit-head h3{text-shadow:0 2px 0 color-mix(in srgb,var(--c-d) 60%,transparent)}
.node{background:radial-gradient(46% 30% at 50% 17%,rgba(255,255,255,.62),rgba(255,255,255,0) 100%),radial-gradient(110% 90% at 50% 8%,color-mix(in srgb,var(--c) 62%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 82%,#000) 100%);box-shadow:0 7px 0 var(--c-d),0 20px 30px -12px color-mix(in srgb,var(--c) 75%,transparent),inset 0 2px 1px rgba(255,255,255,.5),inset 0 -5px 0 rgba(0,0,0,.1),0 0 0 5px color-mix(in srgb,var(--c) 16%,transparent);transition:transform .1s,box-shadow .1s,translate .35s var(--e-spring),scale .35s var(--e-spring)}
.node.locked{background:radial-gradient(46% 30% at 50% 17%,rgba(255,255,255,.3),rgba(255,255,255,0) 100%),var(--lock);box-shadow:0 6px 0 var(--lock-d),inset 0 2px 1px var(--hi),0 0 0 5px color-mix(in srgb,var(--lock) 30%,transparent)}
@media (hover:hover){.node:not(.locked):hover{translate:0 -4px;scale:1.04}}
.node-wrap.cur::before{content:"";position:absolute;top:-17px;left:50%;width:110px;height:106px;margin-left:-55px;border-radius:50%;pointer-events:none;background:repeating-conic-gradient(from 0deg,var(--c) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(closest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(closest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));opacity:.5;animation:spin 16s linear infinite}
.node-label{padding:3px 10px 4px;border-radius:11px;background:color-mix(in srgb,var(--bg) 72%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent)}
.tr-on{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--c) 55%,transparent))}
.start-bubble{background:linear-gradient(var(--surface-hi),var(--surface-lo));box-shadow:var(--lift-sm)}
.start-bubble::after{background:var(--surface-lo)}
@supports (animation-timeline: view()){.unit-num{animation:numPar linear both;animation-timeline:view();animation-range:cover}}
@keyframes numPar{from{translate:0 26px}to{translate:0 -26px}}

/* repasar */
.mini-lot{box-shadow:5px 5px 0 var(--c),0 18px 30px -16px rgba(0,0,0,.55)}
.rv-num .big{background:linear-gradient(180deg,color-mix(in srgb,var(--rosa) 60%,#fff),var(--rosa));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 color-mix(in srgb,var(--rosa-d) 55%,transparent))}
.deck-bar span{background-image:linear-gradient(180deg,rgba(255,255,255,.35),transparent 65%)}
.deck-bar{box-shadow:inset 0 2px 3px rgba(0,0,0,.18)}

/* yo */
.flame-big{background:radial-gradient(60% 60% at 50% 62%,color-mix(in srgb,var(--sol) 34%,transparent),transparent 72%),color-mix(in srgb,var(--sol) 10%,var(--surface-hi));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px color-mix(in srgb,var(--sol) 28%,transparent),0 14px 30px -16px var(--sol)}
.flame-big::before{content:"";position:absolute;inset:18px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--sol) 60%,transparent),transparent);filter:blur(7px);animation:glow 1.7s ease-in-out infinite alternate}
@keyframes glow{from{scale:.85;opacity:.6}to{scale:1.15;opacity:1}}
.flame-big .i{position:relative;filter:drop-shadow(0 4px 8px color-mix(in srgb,var(--chile) 50%,transparent))}
.flame-big b{bottom:-7px;right:-7px;min-width:34px;height:34px;padding:0 8px;border-radius:17px;display:grid;place-items:center;font-size:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--sol) 75%,#fff),var(--sol));color:var(--on-sol);box-shadow:0 0 0 3px var(--surface-hi),0 8px 16px -8px var(--sol-d)}
.bfill{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 16px -8px var(--jade)}
.bfill.hit{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 16px -8px var(--sol)}
.btrack{box-shadow:inset 0 2px 3px rgba(0,0,0,.14)}
.heat i.l3,.heat i.l4{box-shadow:0 0 8px -2px currentColor}
.heat i.l3{color:var(--jade)}.heat i.l4{color:var(--sol)}

/* overlays: living color behind lessons, glass foot, striped progress */
.ov::before{content:"";position:absolute;inset:-12%;z-index:0;pointer-events:none;background:radial-gradient(42% 32% at 14% 6%,color-mix(in srgb,var(--c,var(--rosa)) 22%,transparent),transparent 70%),radial-gradient(38% 30% at 92% 28%,color-mix(in srgb,var(--sol) 12%,transparent),transparent 70%),radial-gradient(55% 40% at 50% 108%,color-mix(in srgb,var(--azul) 18%,transparent),transparent 70%);animation:drift 26s ease-in-out infinite alternate}
.ov>.ov-top,.ov>.ov-body,.ov>.ov-foot{position:relative;z-index:1}
.ov-foot{border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 76%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4)}
.bar{height:15px;background:color-mix(in srgb,var(--surface-2) 92%,transparent);box-shadow:inset 0 2px 3px rgba(0,0,0,.2)}
.bar-fill{background-image:linear-gradient(45deg,rgba(255,255,255,.16) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.16) 50%,rgba(255,255,255,.16) 75%,transparent 75%),linear-gradient(90deg,var(--jade),color-mix(in srgb,var(--jade) 45%,var(--sol)),var(--sol));background-size:15px 15px,100% 100%;animation:stripes .9s linear infinite;box-shadow:0 0 16px -3px color-mix(in srgb,var(--sol) 70%,transparent)}
@keyframes stripes{to{background-position:15px 0,0 0}}
.x{transition:transform .12s,background .2s,rotate .4s var(--e-spring)}
@media (hover:hover){.x:hover{background:var(--surface-2);rotate:90deg}}
.edge-flash{position:absolute;inset:0;z-index:4;pointer-events:none;animation:edgeFlash .85s ease-out forwards}
.edge-flash.good{--fc:var(--good)}.edge-flash.bad{--fc:var(--bad)}
@keyframes edgeFlash{0%{box-shadow:inset 0 0 0 0 transparent}22%{box-shadow:inset 0 0 90px 6px color-mix(in srgb,var(--fc) 42%,transparent)}100%{box-shadow:inset 0 0 140px 0 transparent}}
.opt .n{background:linear-gradient(var(--surface-hi),var(--surface-2));border:1px solid var(--line);box-shadow:inset 0 -2px 0 var(--line)}
.opt[aria-pressed="true"]{box-shadow:0 0 0 4px color-mix(in srgb,var(--azul) 16%,transparent),0 4px 0 color-mix(in srgb,var(--azul) 45%,var(--edge))}
.opt.right{box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 20%,transparent),0 0 30px -6px color-mix(in srgb,var(--good) 55%,transparent)}
.tile{background:linear-gradient(180deg,var(--surface-hi),var(--surface-lo));box-shadow:0 8px 14px -12px rgba(0,0,0,.6)}
.type-in,.pr-say textarea,.search,.mk input,.ob-name{background:linear-gradient(180deg,var(--surface-lo),var(--surface-hi));box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.fb{border-top:1px solid color-mix(in srgb,var(--fbc) 40%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 -24px 60px -24px color-mix(in srgb,var(--fbc) 60%,transparent);isolation:isolate}
.fb.good{--fbc:var(--good);background:color-mix(in srgb,var(--good-bg) 90%,transparent)}
.fb.bad{--fbc:var(--bad);background:color-mix(in srgb,var(--bad-bg) 90%,transparent)}
.fb::before{content:"";position:absolute;left:50%;top:-50px;width:340px;height:130px;margin-left:-170px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--fbc) 34%,transparent),transparent);pointer-events:none;z-index:-1}
.fb-h .ic{animation:popScale .5s var(--e-spring) both,icRing 1.1s ease-out .25s}
@keyframes icRing{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
.curtain .cu-t{text-shadow:0 5px 0 color-mix(in srgb,var(--c-d) 75%,transparent),0 18px 40px color-mix(in srgb,var(--c-d) 60%,transparent)}
.done-tap{margin-top:16px;font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.04em;transition:opacity .6s}
.done-tap.used{opacity:0}
.done-stars.wob{animation:wob .6s var(--e-spring)}
@keyframes wob{30%{scale:1.12;rotate:-4deg}60%{scale:.97;rotate:2deg}}
.done-t{filter:drop-shadow(0 4px 0 color-mix(in srgb,var(--rosa-d) 45%,transparent))}
.ds{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 14px 28px -16px var(--c-d)}

/* flashcards: a real deck underneath, holographic foil, and a lift when you grab */
.flip-stage{position:relative;width:min(100%,330px);width:min(100%,330px,calc((100dvh - 300px) * .75));min-width:min(100%,240px);aspect-ratio:3/4;margin:12px auto 0;animation:floaty 4.5s ease-in-out infinite alternate}
.flip-stage .flip{position:absolute;inset:0;width:auto;min-width:0;margin:0;aspect-ratio:auto;z-index:2}
.under{position:absolute;inset:0;border-radius:20px;background:var(--surface);border:3px solid var(--ink);box-shadow:7px 7px 0 var(--c);pointer-events:none;transform-origin:50% 100%;animation:fadeIn .4s .15s both}
.under-in{position:absolute;inset:10px;border:2px solid var(--ink);border-radius:13px;background:repeating-conic-gradient(from 0deg at 50% 46%,color-mix(in srgb,var(--c) 16%,transparent) 0 7deg,transparent 7deg 14deg)}
.under.u1{z-index:1;translate:0 calc(16px - 16px * var(--p));scale:calc(.93 + .07 * var(--p));opacity:calc(.8 + .2 * var(--p))}
.under.u2{z-index:0;translate:0 calc(30px - 14px * var(--p));scale:calc(.86 + .07 * var(--p));opacity:.5}
.flip.deal2{animation:deal2 .45s var(--e-out) both}
@keyframes deal2{from{scale:.97;opacity:.4}}
.flip-tilt{transition:transform .35s var(--e-out),scale .35s var(--e-spring)}
.flip.press .flip-tilt{scale:.965}
.lot{box-shadow:7px 7px 0 var(--c),0 26px 44px -22px rgba(0,0,0,.55)}
.lot::before{content:"";position:absolute;inset:0;border-radius:17px;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 22%,rgba(255,90,190,.14) 36%,rgba(90,215,255,.14) 46%,rgba(255,235,110,.14) 56%,transparent 70%);background-size:250% 250%;background-position:var(--hx,0%) var(--hy,50%);transition:background-position .4s var(--e-out)}
.intro-card .lot::before{animation:holo 5s ease-in-out infinite alternate}
@keyframes holo{from{background-position:0% 50%}to{background-position:100% 50%}}
.flip{--hx:calc(100% - var(--gx,50%));--hy:var(--gy,50%)}
.stamp{box-shadow:0 8px 20px -10px currentColor}

/* sheets, toasts */
.scrim{-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.sheet{background:linear-gradient(180deg,var(--surface-hi),var(--surface-lo) 220px);box-shadow:inset 0 1px 0 var(--rim-a),0 -24px 60px -20px rgba(0,0,0,.5)}
.grab{width:46px;background:color-mix(in srgb,var(--ink-2) 45%,transparent)}
.toast{background:color-mix(in srgb,var(--ink) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 18px 40px -16px rgba(0,0,0,.55)}
.xpfloat{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 20px -8px var(--sol-d)}

/* mic: bars that bounce with your voice */
.mic-big{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 0 var(--rosa-d),0 16px 30px -12px var(--rosa)}
.mic-big .lv{display:none;align-items:center;gap:4px;height:28px}
.mic-big.on .lv{display:inline-flex}
.mic-big.on>.i{display:none}
.mic-big .lv i{display:block;width:4px;height:28px;border-radius:2px;background:currentColor;scale:1 .22;animation:lvIdle .7s ease-in-out infinite alternate;animation-delay:calc(var(--k) * -.17s)}
.mic-big.metered .lv i{animation:none;scale:1 calc(.16 + var(--lvl,0) * var(--m,1) * .84);transition:scale .07s linear}
.mic-big .lv i:nth-child(1){--k:1;--m:.55}.mic-big .lv i:nth-child(2){--k:2;--m:.85}.mic-big .lv i:nth-child(3){--k:3;--m:1}.mic-big .lv i:nth-child(4){--k:4;--m:.75}.mic-big .lv i:nth-child(5){--k:5;--m:.5}
@keyframes lvIdle{to{scale:1 .65}}
.mic-big.metered{animation:none;scale:calc(1 + var(--lvl,0) * .03)}
.mic-big.metered::after{animation:none;opacity:calc(.15 + var(--lvl,0) * .7);scale:calc(1 + var(--lvl,0) * .07);transition:scale .08s linear,opacity .08s linear}
.pr-card{box-shadow:7px 7px 0 var(--c),0 26px 44px -22px rgba(0,0,0,.5)}
.pw.ok{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 30%,transparent)}
.pw.miss{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 30%,transparent)}


.today-card .ring-f,.today-card .ring-f.full{stroke:url(#rg88)}
.today-card .ring-t{stroke:color-mix(in srgb,var(--surface-2) 80%,#000)}
.flip-stage{margin-bottom:34px}
.under{box-shadow:5px 5px 0 var(--c)}
.under.u1{translate:0 calc(14px - 14px * var(--p))}
.under.u2{translate:0 calc(26px - 12px * var(--p))}
.ex-intro{min-height:100%;display:flex;flex-direction:column}
.ex-intro .intro-wrap{margin-block:auto;width:100%}
.ex-intro .intro-card{min-height:min(380px,calc(100dvh - 300px))}
.intro-card .lot{height:auto}
.rv-ex.cont,.rv-ex.cont .under{animation:none}
.rv-ex.cont .flip-stage{animation-delay:-2s}
/* softer page changes */
@keyframes paneIn{from{opacity:0;translate:26px 0;scale:.985}}
@keyframes paneInB{from{opacity:0;translate:-26px 0;scale:.985}}
@keyframes riseIn{from{opacity:0;translate:0 22px;scale:.98}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
 .path .node,.path .node-label,.unit .unit-head,.unit-num{animation:none!important}}
</style>
</head>
<body>


<div class="bg-fx" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>
<div id="app">
  <div class="picado" id="picado" aria-hidden="true"></div>
  <header class="topbar-wrap" id="topbar">
    <div class="wrap topbar">
      <div class="brand" data-act="brand" role="img" aria-label="Charla, español de México"><span aria-hidden="true"><span class="bl" style="--i:0">C</span><span class="bl" style="--i:1">h</span><span class="bl" style="--i:2">a</span><span class="bl" style="--i:3">r</span><span class="bl" style="--i:4">l</span><span class="bl" style="--i:5">a</span></span><small aria-hidden="true">de México</small></div>
      <div class="chips">
        <button class="chip" id="chipStreak" data-act="tab" data-v="yo" aria-label="Streak"><span class="fl" id="flame"></span><b id="stkNum">0</b></button>
        <button class="chip" id="chipXp" data-act="tab" data-v="yo" aria-label="Today's XP"><span id="xpRing"></span><b id="xpNum">0</b><span class="muted" id="xpGoal">/20 XP</span></button>
      </div>
    </div>
  </header>
  <main class="wrap" id="view"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="tabs-in" id="tabs"></div></nav>
<div id="ov" hidden></div>
<div id="sheetHost"></div>
<canvas id="cf" aria-hidden="true"></canvas>
<div id="fxHost" aria-hidden="true"></div>
<div id="toastHost" aria-live="polite"></div>

<script>
(()=>{
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const REDUCED=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();
const hash=s=>{let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}return 'k'+(h>>>0).toString(36)};
const stripP=s=>String(s).replace(/[¿?¡!.,;:"“”«»()…]/g,'');
const norm=s=>stripP(String(s).toLowerCase()).replace(/\s+/g,' ').trim();
const deacc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
/* for grading: drop accent marks but keep ñ, since año and ano are different words */

 const x=a.split(' '),y=v.split(' ');return x.length===y.length&&x.every((w,i)=>w.length<=4?w===y[i]:w.slice(-1)===y[i].slice(-1))};

function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return m[a.length][b.length]}
function tween(el,from,to,dur=800,fmt=v=>String(Math.round(v))){
 if(!el)return;const tok=(el._tw||0)+1;el._tw=tok;
 if(REDUCED||from===to){el.textContent=fmt(to);return}
 const t0=performance.now();
 const step=now=>{if(el._tw!==tok)return;const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(step)};
 el.textContent=fmt(from);requestAnimationFrame(step);
}
const restart=(el,cls)=>{if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)};

function rulesFor(sc){return `You are role-playing to help a total beginner (CEFR A1) practice Mexican Spanish (español de México).
ROLE: ${sc.role}
Address the learner as ${sc.tu?'tú':'usted'}.${displayName()?` The learner's name is ${displayName()}; use it now and then.`:''}
Style: very simple Mexican Spanish. One or two short sentences, under 20 words in total, present tense, very common words. Stay in character and keep the conversation moving, usually ending with one simple question.
Speak the way people do in Mexico: Mexican vocabulary and expressions (for example ¿mande?, ahorita, padre, carro, celular, jugo, camión for a city bus, cuadra), ustedes and never vosotros, prices in pesos.${sc.patient?' Talk like an everyday Mexican patient would (for example me duele la panza, me falta el aire, tengo azúcar, me operaron). As the patient, do not lead the interview: let the learner ask the questions, and answer only what they ask.':''}
If the learner writes in English or asks how to say something, give them the Mexican Spanish briefly inside your reply, then continue in character.
Before replying, check the learner's last message for Spanish mistakes (grammar, word choice, ${sc.tu?'tú':'usted'} forms, gender agreement). If they used a word or form from Spain (vosotros, coche, zumo, vale, ordenador, móvil), give the Mexican version as the fix. Ignore missing accents and capital letters unless they change the meaning.
A learner message ending in [dictated] was spoken out loud and typed by phone dictation. A wrong or strange word there is probably dictation mishearing their pronunciation: name the word they likely meant in SOUND and how to say it, instead of treating it as a grammar mistake.
Reply in exactly this format: five lines, plain text, no markdown.
ES: <your reply in Spanish>
EN: <natural English translation of your reply>
FIX: <if the learner's last message had a Spanish mistake: the corrected sentence, then " — " and a 5-12 word reason in English. If it was fine, or written in English, or there is no learner message yet: none>
SOUND: <one short, concrete pronunciation tip in English for a word from the learner's last message that English speakers often get wrong (rr, tap r, j, ll, ñ, soft d, pure vowels, stressed syllable), with the word in Spanish. If there is no learner message yet or nothing worth noting: none>
IDEAS: <two short things the learner could say next, in Spanish, separated by " | ">`}

/* Two devices can both make progress before either syncs, so sync merges instead of letting the newest copy win.
   - XP is counted per device per day (dd), so XP earned the same day on two devices adds up instead of one being lost.
   - A reset (resetAt) trims the other copy to what happened after it; deleted custom lessons are remembered (gone).
   - Settings follow their own clock (settingsAt), so finishing a lesson on one device doesn't undo a settings change made on another. */
let DEV='';try{DEV=localStorage.getItem('charla-dev')||'';if(!DEV){DEV=Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem('charla-dev',DEV)}}catch(e){DEV=DEV||'d0'}
const sumObj=o=>Object.values(o||{}).reduce((x,y)=>x+(y||0),0);
const ddDay=(s,k)=>Object.values(s.dd||{}).reduce((x,d)=>x+((d&&d[k])||0),0);
const stable=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);

/* Day totals can't be split at the reset moment, so the copy that missed the reset keeps only XP from the days after it
   (its cards, lessons and custom lessons are timestamped and survive exactly). */
function afterReset(s,R){
 const day=dk(new Date(R)),keep=o=>Object.fromEntries(Object.entries(o||{}).filter(([k])=>k>day));
 const t={...s,days:keep(s.days),dd:Object.fromEntries(Object.entries(s.dd||{}).map(([d,o])=>[d,keep(o)])),
  done:Object.fromEntries(Object.entries(s.done).filter(([,v])=>v&&(v.at||0)>R)),
  cards:Object.fromEntries(Object.entries(s.cards).filter(([,c])=>(c.t||0)>R)),
  custom:s.custom.filter(c=>c&&cidT(c.id)>R)};
 t.xp=sumObj(t.days);return t;
}
function mergeState(a0,b0){
 const R=Math.max(a0.resetAt||0,b0.resetAt||0);
 const a=(a0.resetAt||0)<R?afterReset(a0,R):a0,b=(b0.resetAt||0)<R?afterReset(b0,R):b0,m=fresh();
 m.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);m.resetAt=R||undefined;
 /* settings: an empty copy (a brand-new device) never wins; then the settings clock; only if neither copy has one, the progress clock */
 const ea=isEmpty(a0),eb=isEmpty(b0),hasClk=a.settingsAt||b.settingsAt,clk=s=>hasClk?(s.settingsAt||0):(s.updatedAt||0);
 const src=ea&&!eb?b:eb&&!ea?a:clk(b)>clk(a)?b:a;
 const name=src.settingsAt&&!(ea!==eb)?src.settings.name:(src.settings.name||a.settings.name||b.settings.name||'');
 m.settings={...src.settings,name:name||'',onboarded:!!(a.settings.onboarded||b.settings.onboarded)};
 m.settingsAt=Math.max(a.settingsAt||0,b.settingsAt||0)||undefined;
 for(const s of [a,b])for(const [d,o] of Object.entries(s.dd||{})){const t=m.dd[d]=m.dd[d]||{};for(const [k,v] of Object.entries(o||{}))t[k]=Math.max(t[k]||0,v||0)}
 const legacy=(s,k)=>Math.max(0,((s.days||{})[k]||0)-ddDay(s,k));
 for(const k of new Set([...Object.keys(a.days),...Object.keys(b.days)])){const v=Math.max(legacy(a,k),legacy(b,k))+ddDay(m,k);if(v)m.days[k]=v}
 m.xp=Math.max(0,(a.xp||0)-sumObj(a.days),(b.xp||0)-sumObj(b.days))+sumObj(m.days);
 m.gone={...(a.gone||{}),...(b.gone||{})};
 for(const s of [a,b])for(const [k,v] of Object.entries(s.done)){if(m.gone[k])continue;const p=m.done[k];m.done[k]=!p?v:{s:Math.max(p.s||0,v.s||0),at:Math.max(p.at||0,v.at||0)}}
 for(const s of [a,b])for(const [k,c] of Object.entries(s.cards)){const p=m.cards[k];if(!p||(c.rv||0)>(p.rv||0)||((c.rv||0)===(p.rv||0)&&(c.d||0)>(p.d||0)))m.cards[k]=c}
 const seen=new Set();m.custom=[...a.custom,...b.custom].filter(c=>c&&!m.gone[c.id]&&!seen.has(c.id)&&seen.add(c.id)).sort((x,y)=>cidT(y.id)-cidT(x.id)).slice(0,30);
 m.nextNo=Math.max(a.nextNo||1,b.nextNo||1,...Object.values(m.cards).map(c=>(c.no||0)+1));
 return m;
}
async function push(retried){
 if(!DBDOC)return; if(writing||!pulled){dirty=true;return}
 writing=true;
 try{
  const snap=await DBDOC.get();
  if(snap.exists){const before=stable(S);S=mergeState(S,migrate(clone(snap.data()||{})));SET_SIG=setSig(S);if(stable(S)!==before){writeLocal();refreshChrome()}}
  await DBDOC.set(clone(S));SYNC='cloud'}
 catch(e){const c=e&&e.code;
  if(c==='unavailable'&&!retried){writing=false;setTimeout(()=>push(true),800+Math.random()*900);return}
  if(['invalid_argument','revoked','not_granted','quota_exceeded','capability_disabled'].includes(c)){DBDOC=null;SYNC='local'}
  else if(c==='unavailable'){dirty=true;writing=false;setTimeout(()=>{if(dirty&&!writing){dirty=false;push()}},15000);return}}
 writing=false; if(dirty&&DBDOC){dirty=false;push()}
}
async function pull(){
 try{
  const snap=await DBDOC.get();SYNC='cloud';
  if(snap.exists){const before=stable(S),r=migrate(clone(snap.data()||{}));S=mergeState(S,r);SET_SIG=setSig(S);
   if(stable(S)!==before){writeLocal();softRender()}
   pulled=true;if(dirty||stable(S)!==stable(r)){dirty=false;push()}
  } else {pulled=true;if(S.updatedAt||dirty){dirty=false;push()}}
  if(curTab==='yo'&&OV.hidden){const s=$('#syncNote');if(s)s.textContent='Progress syncs to your Claude account.'}
 }catch(e){SYNC='local';pulled=true;if(dirty&&DBDOC){dirty=false;clearTimeout(pushT);pushT=setTimeout(push,1200)}}
}

function drawTrails(){

  S.custom.unshift(c);S.gone=S.gone||{};for(const old of S.custom.slice(30)){delete S.done[old.id];S.gone[old.id]=Date.now()}S.custom=S.custom.slice(0,30);MK_BUSY=null;save();
  st=$('#mkStatus');btn=$('#mkBtn');

  const inp=$('#mkTopic');if(inp)inp.value='';

  const el=$('#cl-'+c.id);if(el&&!REDUCED){setTimeout(()=>{const p=rectC(el);burst(p.x,p.y,22)},250)}

}

 let hw=Math.random()*3|0,hp=Math.random()*3|0;
 const hard=it=>it.kind==='phrase'?HP[(hp++)%3]:HW[(hw++)%3];
 if(!replay){
  items.forEach(it=>{out.push({t:'intro',it});out.push({t:'mcES2EN',it})});

  if((c==='c'&&n==='h')||(c==='l'&&n==='l')||(c==='r'&&n==='r')){out.push({t:'C',s:c+n});i+=2;continue}
  if(c==='y'){out.push({t:n&&isV(n)?'C':'V',s:c});i++;continue}

  if(!groups.slice(k+1).some(x=>x.type==='N')){syl[syl.length-1]+=a.join('');return}

function updSend(){const b=$('#sendBtn'),ta=$('#chatIn');if(!b||!CH)return;const mode=CH.busy?'stop':'send';
 if(mode!==sendMode){b.innerHTML=ic(mode==='stop'?'stop':'send');sendMode=mode}

function parseAI(t){
 const get=tag=>{const m=t.match(new RegExp('(?:^|\\n)\\s*\\**'+tag+'\\**\\s*:\\s*([\\s\\S]*?)(?=\\n\\s*\\**(?:ES|EN|FIX|SOUND|IDEAS)\\**\\s*:|$)','i'));return m?m[1].trim():''};
 let es=get('ES');const en=get('EN');let fix=get('FIX'),sound=get('SOUND');const ir=get('IDEAS');
 if(!es&&!/(^|\n)\s*(EN|FIX|SOUND|IDEAS)\s*:/i.test(t))es=t.replace(/^\s*ES\s*:?/i,'').trim();
 const none=/^(none|n\/a|ninguno|ninguna|no mistakes?|nothing)\.?$/i;
 if(none.test(fix))fix='';if(none.test(sound))sound='';
 const ideas=ir?ir.split('|').map(s=>s.trim().replace(/^["“]|["”]$/g,'')).filter(Boolean).slice(0,3):[];
 return{es,en,fix,sound,ideas};
}

async function aiTurn(){
 if(!CH)return;CH.busy=true;updSend();
 const m={role:'ai',es:'',en:'',pending:true},i=CH.msgs.length;CH.msgs.push(m);
 $('#chatLog').insertAdjacentHTML('beforeend',`<div class="msg ai live" id="m${i}">${SUN}<div class="msg-b"><div class="es">${DOTS}</div></div></div>`);chatScroll();
 const ctl=new AbortController();CH.ctl=ctl;const mine=CH;let shown='';
 const finish=()=>{const el=$('#m'+i);if(!el)return;el.classList.remove('live');const es=el.querySelector('.es');if(es.textContent!==m.es||es.querySelector('.dots'))es.textContent=m.es;el.querySelector('.msg-b').insertAdjacentHTML('beforeend',aiExtras(m,i))};
 try{
  const {text}=await SAMPLE(CH.turns,{modelTier:'quick',cache:false,signal:ctl.signal,onText:({text})=>{
   if(CH!==mine||!/ES\s*:/i.test(text))return;
   const line=(parseAI(text).es||'').split('\n')[0];
   if(!line.trim()||line===shown)return;
   const el=$('#m'+i+' .es');if(!el)return;
   if(!shown)el.textContent='';
   if(shown&&!line.startsWith(shown))el.textContent=line;
   else{const sp=document.createElement('span');sp.className='w';sp.textContent=line.slice(shown.length);el.appendChild(sp)}
   shown=line;chatScroll();
  }});
  if(CH!==mine)return;
  const p=parseAI(text);Object.assign(m,p);m.pending=false;if(!m.es)m.es=text.trim();
  CH.turns.push({role:'assistant',content:text});
  finish();
  const chips=[];if(p.fix)chips.push(`<div class="fix"><span class="k">Mejor</span><span>${esc(p.fix)}</span></div>`);if(p.sound&&CH.lastMe!=null)chips.push(`<div class="fix snd"><span class="k">Pronunciación</span><span>${esc(p.sound)}</span></div>`);
  if(chips.length&&CH.lastMe!=null){const slot=$('#fx'+CH.lastMe);if(slot)slot.outerHTML=chips.join('')}
  drawIdeas(p.ideas);
  if(CH.voice&&m.es)speak(m.es);
 }catch(e){
  if(CH!==mine)return;const r=aiErr(e);m.pending=false;m.es=e&&e.text?(parseAI(e.text).es||shown):shown;m.err=r.msg;m.retry=r.retry;
  if(r.refused){m.es='';if(CH.turns.length>1&&CH.turns[CH.turns.length-1].role==='user'){CH.turns.pop();m.retry=false}}
  finish();
 }
 CH.busy=false;CH.ctl=null;updSend();chatScroll();
 const fbb=$('#fbBtn');if(fbb)fbb.hidden=CH.count<3;
}
function sendChat(){
 if(!CH||CH.busy)return;const ta=$('#chatIn'),text=ta.value.trim();if(!text)return;
 const i=CH.msgs.length;CH.msgs.push({role:'me',text});CH.lastMe=i;
 $('#chatLog').insertAdjacentHTML('beforeend',`<div class="msg me"><div class="msg-b">${esc(text)}</div></div><div id="fx${i}" hidden></div>`);
 const typed=(CH.keys||0)>=text.length*.6;
 CH.turns.push({role:'user',content:text+((CH.dictated||(CH.voice&&!typed))?' [dictated]':'')});CH.dictated=false;CH.keys=0;CH.prevLen=0;
 while(CH.turns.length>31)CH.turns.splice(1,2);
 CH.count++;CH.xp+=2;addXP(2);sfx.tap();
 ta.value='';ta.style.height='auto';drawIdeas([]);chatScroll();aiTurn();
}

 const loading=()=>openSheet(`<div class="k tint c-rosa">Feedback · ${esc(sc.title)}</div><h2 class="sheet-t">¿Cómo te fue?</h2><div id="fbkBody" style="margin-top:14px"><span class="shimmer">Luz is reading your conversation…</span></div>`);

 loading();
 const prompt=`You are a kind, specific Mexican Spanish teacher. A total beginner (A1) learning Mexican Spanish just finished this role-play.
Scenario: ${sc.title} (${sc.sub}). ${sc.patient?'The learner played a clinician talking with a Spanish-speaking patient. Judge clarity, correct use of usted, and whether they asked the key questions.':''}
Transcript:
${tr}

Return only JSON in this shape: {"score": integer 1-5, "summary": "one encouraging sentence", "wins": ["short point", "short point"], "fixes": [{"said": "the learner's words", "better": "corrected Spanish", "why": "short reason in English"}], "phrases": [["useful Spanish phrase for this scenario", "English"], ["...", "..."], ["...", "..."]]}

  ${wins.length?`<h3 class="sheet-h">Lo que hiciste bien</h3><ul class="fbk-list">${wins.map(w=>`<li style="--i:${k++}">${esc(w)}</li>`).join('')}</ul>`:''}
  ${fixes.length?`<h3 class="sheet-h">Para mejorar</h3><ul class="fbk-list">${fixes.map(f=>`<li style="--i:${k++}">${f.said?`<span class="said">${esc(f.said)}</span><br>`:''}<span class="better">${esc(f.better)}</span>${f.why?`<br><span class="muted">${esc(f.why)}</span>`:''}</li>`).join('')}</ul>`:''}
  ${phr.length?`<h3 class="sheet-h">Frases útiles</h3><ul class="fbk-list">${phr.map(a=>`<li class="fbk-ph" style="--i:${k++}"><span><b>${esc(a[0])}</b><br><span class="muted">${esc(a[1])}</span></span><button class="mini" data-act="addCard" data-es="${esc(a[0])}" data-en="${esc(a[1])}">${ic('plus')}Add</button></li>`).join('')}</ul>`:''}
  <button class="btn block c-azul" style="margin-top:18px" data-act="closeSheet">Seguir practicando</button>`;
  if(at>(mine.fbAt||0)){mine.fbAt=at;mine.xp+=5;addXP(5)}
  if(score>=4&&!REDUCED){const s=$('.fbk-score');if(s){const c=rectC(s);setTimeout(()=>burst(c.x,c.y,24,[cssVar('sol'),cssVar('rosa')]),500)}}
