 prMic(t){if(!PR)return;const ta=$('#sayIn');if(!ta)return;if(ta.readOnly)prRetry();listen({btn:t,onText:txt=>{ta.value=txt;ta.dispatchEvent(new Event('input'))},onEnd:()=>{if(PR&&ta.isConnected&&!ta.readOnly&&ta.value.trim())prCheck()}})},
 chatMic(t){if(!CH)return;const ta=$('#chatIn');listen({btn:t,onText:txt=>{ta.value=txt;ta.dispatchEvent(new Event('input'))},onEnd:()=>{if(CH&&ta.value.trim()){CH.dictated=true;if(CH.voice)sendChat()}}})},
 /* welcome setup */
 obTrack(t,v){segSet(t);S.settings.track=v;save();if(curTab==='aprender')renderView()},
 obGoal(t,v){segSet(t);S.settings.goal=+v;save();renderHeader()},
 obGo(t){const n=$('#obName');S.settings.name=n?n.value.trim().slice(0,30):'';S.settings.onboarded=true;save();closeSheet();shownXP=null;renderAll('load');if(!REDUCED){const c=rectC(t);burst(c.x,c.y,26)}sfx.win()}
};
function showWelcome(){
 S.settings.onboarded=true;writeLocal();
 const tk=S.settings.track,g=S.settings.goal,goals=[[10,'Ligera'],[20,'Normal'],[30,'Seria'],[50,'Intensa']],gp=Math.max(0,goals.findIndex(x=>x[0]===g));
 openSheet(`<div class="k tint c-rosa">Charla · Mexican Spanish</div><h2 class="sheet-t">¡Hola! Let’s set you up</h2><p class="tip-b" style="font-size:16px;margin-top:6px">Free lessons, flashcards and conversation practice. Your progress is saved just for you.</p>
 <h3 class="sheet-h">¿Cómo te llamas? · Your name</h3><input class="ob-name" id="obName" maxlength="30" autocomplete="given-name" placeholder="Optional" value="${esc(displayName())}" aria-label="Your name">
 <h3 class="sheet-h">¿Qué quieres aprender? · Your path</h3><div class="seg ob-seg" style="--n:2;--pos:${tk==='clinica'?1:0}" role="group" aria-label="Path">${Object.values(TRACKS).map(x=>`<button data-act="obTrack" data-v="${x.key}" aria-pressed="${tk===x.key}">${x.name}<small>${x.key==='diario'?'Everyday life':'Talking with patients'}</small></button>`).join('')}</div>
 <h3 class="sheet-h">Meta diaria · Daily goal</h3><div class="seg sm" style="--n:4;--pos:${gp}" role="group" aria-label="Daily goal">${goals.map(([v,l])=>`<button data-act="obGoal" data-v="${v}" aria-pressed="${g===v}">${v} XP<small>${l}</small></button>`).join('')}</div>
 <p class="rv-next" style="margin-top:10px">You can change all of this later under Yo.</p>
 <button class="btn block shine c-rosa" style="margin-top:16px" data-act="obGo">¡Vamos! Let’s go</button>`);
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=ACT[t.dataset.act];if(f)f(t,t.dataset.v,e)});
document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-keepfocus]'))e.preventDefault()});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#sheetHost').firstChild){e.preventDefault();closeSheet();return}
 if(OV.hidden||$('#sheetHost').firstChild)return;
 if($('#curtain:not(.out)')){if(e.key==='Enter'||e.key===' '){e.preventDefault();liftCurtain()}return}
 const inField=e.target.matches('input,textarea');
 if(LS){
  if(e.key==='Enter'&&!inField){const g=$('#go2')||$('#go');if(g&&!g.disabled){e.preventDefault();g.click()}}
  else if(!inField&&/^[1-4]$/.test(e.key)&&LS.state==='q'){const b=$$('.opt')[+e.key-1];if(b)b.click()}
 }else if(RV){
  if((e.key===' '||e.key==='Enter')&&!RV.shown){e.preventDefault();showRv()}
  else if(RV.shown&&/^[1-4]$/.test(e.key))flyCard(['again','hard','good','easy'][+e.key-1]);
  else if(RV.shown&&e.key==='ArrowRight')flyCard('good');
  else if(RV.shown&&e.key==='ArrowLeft')flyCard('again');
 }
});
window.addEventListener('resize',()=>{clearTimeout(buildPicado.t);buildPicado.t=setTimeout(()=>{buildPicado();if(curTab==='aprender'&&OV.hidden)drawTrails()},150)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&OV.hidden)softRender()});
if('IntersectionObserver' in window){try{new IntersectionObserver(([en])=>{$('#topbar').classList.toggle('stuck',!en.isIntersecting)},{threshold:0}).observe($('#picado'))}catch(e){}}
if('ResizeObserver' in window){let raf=0;try{new ResizeObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{if(curTab==='aprender'&&OV.hidden)drawTrails()})}).observe(VIEW)}catch(e){}}
try{document.fonts&&document.fonts.ready.then(()=>{if(curTab==='aprender')drawTrails()})}catch(e){}

/* ================= motion kit ================= */
function springFrames(k=210,c=16,v0=0){let x=0,v=v0;const out=[0],dt=1/60;for(let i=0;i<150;i++){const a=k*(1-x)-c*v;v+=a*dt;x+=v*dt;out.push(x);if(Math.abs(1-x)<.002&&Math.abs(v)<.02)break}out[out.length-1]=1;return out}
function springTo(el,x,y,r,k,c){
 if(!el)return;el.style.transform='';if(REDUCED||!el.animate||(Math.abs(x)<.5&&Math.abs(y)<.5&&Math.abs(r)<.1))return;
 const fr=springFrames(k,c);
 el._sp=el.animate(fr.map(p=>{const q=1-p;return{transform:`translate(${(x*q).toFixed(2)}px,${(y*q).toFixed(2)}px) rotate(${(r*q).toFixed(3)}deg)`}}),{duration:Math.round(fr.length*1000/60),easing:'linear'});
 el._sp.onfinish=()=>{el._sp=null};
}
function haptic(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function edgeFlash(ok){if(REDUCED||OV.hidden)return;const f=document.createElement('div');f.className='edge-flash '+(ok?'good':'bad');f.setAttribute('aria-hidden','true');OV.appendChild(f);setTimeout(()=>f.remove(),900)}
function bindDoneTap(){
 const b=$('#ovBody');if(!b||REDUCED)return;let n=0;
 b.addEventListener('pointerdown',e=>{if(!b.querySelector('.done')||e.target.closest('button'))return;emit({x:e.clientX,y:e.clientY,n:30,angle:-Math.PI/2,spread:Math.PI*1.25,speed:[5,13],size:.9});tone([523,659,784,1047,1319,1568][n%6],0,.2,'triangle',.06);n++;const st=$('.done-stars');if(st)restart(st,'wob');const t=$('.done-tap');if(t)t.classList.add('used')});
}
/* pointer light, 3D tilt and ripples */
const LUX='.today-card,.rv-hero,.deck,.panel,.stat,.me-hero,.tip-card,.pr-res,.scen,.opt,.pr-set,.vrow,.cl,.mt';
const TILT_SEL='.scen:not(:disabled),.stat,.pr-set:not(:disabled),.unit-head,.stack';
const TILT_MAX={scen:7,stat:6,'pr-set':3,'unit-head':3.5,stack:9};
const RIP_SEL='.btn,.opt,.scen,.pr-set,.vrow,.mt,.rate button,.chip,.tab,.idea,.mini,.snd-chip,.seg button,.cl-play,.guide-btn,.send';
let luxEl=null,tiltEl=null;
function luxMove(el,e){const r=el.getBoundingClientRect();el.style.setProperty('--mx',(e.clientX-r.left).toFixed(0)+'px');el.style.setProperty('--my',(e.clientY-r.top).toFixed(0)+'px')}
function setLux(el){if(el===luxEl)return;if(luxEl)luxEl.classList.remove('lit');luxEl=el;if(el)el.classList.add('lit')}
function tiltTo(el,e,f){let m=4;for(const k in TILT_MAX)if(el.classList.contains(k)){m=TILT_MAX[k];break}
 const r=el.getBoundingClientRect(),nx=Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width-.5)*2)),ny=Math.max(-1,Math.min(1,((e.clientY-r.top)/r.height-.5)*2)),a=-ny*m*f,b=nx*m*f,g=Math.hypot(a,b);
 if(g<.05){el.style.removeProperty('--tilt');return}el.classList.add('tilting');el.style.setProperty('--tilt',`${(a/g).toFixed(3)} ${(b/g).toFixed(3)} 0 ${g.toFixed(2)}deg`)}
function setTiltEl(el){if(el===tiltEl)return;if(tiltEl){tiltEl.classList.remove('tilting');tiltEl.style.removeProperty('--tilt')}tiltEl=el}
if(!REDUCED){
 document.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'&&!e.buttons)return;const t=e.target;if(!t||!t.closest)return;
  const l=t.closest(LUX);setLux(l);if(l)luxMove(l,e);
  const tl=t.closest(TILT_SEL);setTiltEl(tl);if(tl)tiltTo(tl,e,e.pointerType==='mouse'?1:.7);
 },{passive:true});
 document.addEventListener('pointerdown',e=>{
  const t=e.target;if(!t||!t.closest)return;
  const l=t.closest(LUX);setLux(l);if(l)luxMove(l,e);
  const tl=t.closest(TILT_SEL);setTiltEl(tl);if(tl)tiltTo(tl,e,.8);
  if(e.button>0)return;const el=t.closest(RIP_SEL);if(!el||el.disabled)return;
  const r=el.getBoundingClientRect(),d=Math.hypot(Math.max(e.clientX-r.left,r.right-e.clientX),Math.max(e.clientY-r.top,r.bottom-e.clientY))*2,sp=document.createElement('span');
  sp.className='rip';sp.setAttribute('aria-hidden','true');sp.style.cssText=`width:${d.toFixed(0)}px;height:${d.toFixed(0)}px;left:${(e.clientX-r.left-d/2).toFixed(0)}px;top:${(e.clientY-r.top-d/2).toFixed(0)}px`;
  el.appendChild(sp);setTimeout(()=>sp.remove(),700);
 },{passive:true});
 const up=e=>{if(e.pointerType!=='mouse'){setLux(null);setTiltEl(null)}};
 document.addEventListener('pointerup',up,{passive:true});document.addEventListener('pointercancel',up,{passive:true});
 document.addEventListener('pointerout',e=>{if(e.pointerType==='mouse'&&!e.relatedTarget){setLux(null);setTiltEl(null)}},{passive:true});
}
/* scroll: background parallax + wind in the papel picado */
const BGFX=$('.bg-fx'),PIC=$('#picado');
let lastSY=scrollY,wind=0,windV=0,scrollRaf=0;
function scrollLoop(){
 const y=scrollY,dv=y-lastSY;lastSY=y;
 BGFX.style.setProperty('--sy',y.toFixed(0));
 const target=Math.max(-14,Math.min(14,dv*.8));windV+=(target-wind)*.14;windV*=.8;wind+=windV;
 PIC.style.setProperty('--wind',wind.toFixed(2));
 if(Math.abs(dv)>.1||Math.abs(wind)>.05||Math.abs(windV)>.05)scrollRaf=requestAnimationFrame(scrollLoop);else{scrollRaf=0;wind=0;windV=0;PIC.style.setProperty('--wind','0')}
}
if(!REDUCED)addEventListener('scroll',()=>{if(!scrollRaf)scrollRaf=requestAnimationFrame(scrollLoop)},{passive:true});
/* tap a flag: it swings and plays a note */
const NOTES=[523,587,659,784,880,1047,1175,1319,1568,1760,2093,2349,2637];
function swingFlag(f,dir,amp){if(REDUCED||!f.animate)return;if(f._sw)f._sw.cancel();const a=dir*amp;
 try{f._sw=f.animate([{rotate:'0deg'},{rotate:`${a}deg`,offset:.14},{rotate:`${(-a*.62).toFixed(1)}deg`,offset:.34},{rotate:`${(a*.36).toFixed(1)}deg`,offset:.54},{rotate:`${(-a*.16).toFixed(1)}deg`,offset:.74},{rotate:'0deg'}],{duration:1500,easing:'ease-out',composite:'add'})}catch(e){}}
PIC.addEventListener('pointerdown',e=>{const f=e.target.closest('.flag');if(!f)return;const r=f.getBoundingClientRect(),dir=e.clientX<r.left+r.width/2?-1:1,i=$$('.flag',PIC).indexOf(f),n=NOTES[i%NOTES.length];
 swingFlag(f,dir,20);tone(n,0,.4,'sine',.07);tone(n*2,.01,.22,'sine',.018);if(!REDUCED){const c=rectC(f);burst(c.x,c.y+10,9,[cssVar(COLORS[i%5]),cssVar('sol')])}});
PIC.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const f=e.target.closest('.flag');if(!f||f._hov)return;f._hov=1;setTimeout(()=>{f._hov=0},700);swingFlag(f,e.movementX<0?1:-1,7)});
/* tap the logo or the greeting */
ACT.brand=()=>{if(!REDUCED)$$('.brand .bl').forEach(b=>restart(b,'hop'));speak('Charla');sfx.sparkle()};
ACT.hello=t=>{speak(t.textContent.replace(/\s+/g,' ').trim());if(!REDUCED)restart(t,'wig')};

/* ================= boot ================= */
if(!S.settings.onboarded&&!isEmpty(S)){S.settings.onboarded=true;writeLocal()}
buildPicado();buildChrome();renderAll('load');initCaps();
setTimeout(()=>{if(!S.settings.onboarded&&isEmpty(S)&&OV.hidden&&!$('#sheetHost').firstChild)showWelcome()},1200);
})();
